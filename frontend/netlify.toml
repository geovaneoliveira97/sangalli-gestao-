[build]
  command = "npm run build"
  publish = "dist"

# SPA: qualquer rota client-side cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # style-src inclui um hash específico para liberar só o <style> embutido
    # em index.html (indicador de carregamento inicial) — se o conteúdo
    # desse bloco mudar, o hash precisa ser recalculado (ver comentário no
    # próprio index.html).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-XtzU1VbaW6ghgGyxiFE8NcQZSIT0X1Ds++qRxWjEnEY='; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# O service worker do PWA não pode ser cacheado por muito tempo
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
