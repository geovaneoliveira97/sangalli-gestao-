<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F6F4" />
    <meta
      name="description"
      content="Sangalli Gestão - Sistema de gestão para oficina mecânica e funilaria: ordens de serviço, orçamentos e acompanhamento do cliente."
    />
    <title>Sangalli Gestão — Oficina Mecânica e Funilaria</title>
    <style>
      /*
        Indicador exibido antes mesmo do JavaScript do app carregar — some
        sozinho assim que o React assume o #root (que substitui todo o
        conteúdo dele). Numa conexão lenta, evita a sensação de "tela preta
        travada" entre a splash screen do PWA e o app de fato aparecer.
      */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f6f4;
      }
      #initial-loader .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 4px solid #dbd7cf;
        border-top-color: #b15f22;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Carregando">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
