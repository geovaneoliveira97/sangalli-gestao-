services:
  mysql:
    image: mysql:8.0
    container_name: autocontrol-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: autocontrol
      MYSQL_USER: autocontrol
      MYSQL_PASSWORD: autocontrol
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - autocontrol_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autocontrol_mysql_data:
